version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /auth
      - /user
      - /chat
      - /onboarding
      - /task
      - /pkg
      - /integration-tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: uv
    directory: /ai
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
