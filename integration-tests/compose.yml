# Ephemeral integration stack. No host ports or production configuration.
services:
  db:
    build: {context: .., dockerfile: integration-tests/fixtures/Dockerfile.postgres}
    environment: {POSTGRES_PASSWORD: integration}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d task_db']
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    build: ../auth
    environment:
      AUTH_DATABASE_URL: postgres://postgres:integration@db:5432/auth_db?sslmode=disable
      AUTH_JWT_SECRET: integration-only-secret-not-for-production
    depends_on:
      db: {condition: service_healthy}
  user:
    build: {context: .., dockerfile: user/Dockerfile}
    environment:
      USER_SERVICE_TOKEN: integration-user-service-token
      AUTH_BASE_URL: "http://auth:8080"
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration
      POSTGRES_DB: users
      GRPC_HOST: 0.0.0.0
      USER_SEED_DEMO: 'true'
    depends_on:
      db: {condition: service_healthy}
  onboarding:
    build: {context: .., dockerfile: onboarding/Dockerfile}
    environment:
      USER_SERVICE_TOKEN: integration-user-service-token
      ONBOARDING_POSTGRES_URL: postgres://postgres:integration@db:5432/onboarding?sslmode=disable
      ONBOARDING_SEED_DEMO: 'false'
      ONBOARDING_SERVICE_TOKEN: integration-onboarding-token
      USER_GRPC_ADDR: user:9090
      AUTH_BASE_URL: http://auth:8080
      ONBOARDING_HTTP_PORT: '8080'
      ONBOARDING_GRPC_PORT: '50051'
    depends_on:
      db: {condition: service_healthy}
  ai:
    image: python:3.13-slim
    command: [python, /fixtures/ai.py]
    volumes: ['./fixtures/ai.py:/fixtures/ai.py:ro']
  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:9092, --list]
      interval: 5s
      timeout: 10s
      retries: 30
  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for topic in task.access_requests.create task.access_requests.create-dlq task.status.changed task.status.changed-dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
  chat:
    build: {context: .., dockerfile: chat/Dockerfile}
    environment:
      USER_SERVICE_TOKEN: integration-user-service-token
      CHAT_POSTGRES_URL: postgres://postgres:integration@db:5432/chat?sslmode=disable
      AUTH_BASE_URL: http://auth:8080
      CHAT_HTTP_PORT: '8080'
      CHAT_GRPC_PORT: '50051'
      USER_GRPC_ADDR: user:9090
      ONBOARDING_GRPC_ADDR: onboarding:50051
      AI_BASE_URL: http://ai:8080
      AI_SERVICE_TOKEN: integration-ai-token
      KAFKA_BROKERS: kafka:9092
    depends_on:
      db: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      user: {condition: service_started}
      auth: {condition: service_started}
      onboarding: {condition: service_started}
      ai: {condition: service_started}
  task:
    build: {context: .., dockerfile: task/Dockerfile}
    environment:
      USER_SERVICE_TOKEN: integration-user-service-token
      TASK_DATABASE_URL: postgres://postgres:integration@db:5432/task_db?sslmode=disable
      TASK_TRACKER_TOKEN: integration-tracker-token
      TASK_USER_BASE_URL: http://user:8080
      TASK_HTTP_ADDR: 0.0.0.0:8084
      TASK_GRPC_ADDR: 0.0.0.0:9094
      KAFKA_BROKERS: kafka:9092
    depends_on:
      db: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      user: {condition: service_started}
  tests:
    build: {context: .., dockerfile: integration-tests/Dockerfile}
    depends_on:
      auth: {condition: service_started}
      user: {condition: service_started}
      chat: {condition: service_started}
      task: {condition: service_started}
