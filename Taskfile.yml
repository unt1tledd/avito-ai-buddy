version: '3'
tasks:
  deps:
    cmds: [make deps]
  verify:
    cmds: [make verify]
  fmt:
    cmds: [make fmt]
  lint:
    cmds: [make lint]
  test:
    silent: true
    cmds:
      - |
        set -o pipefail
        make test | awk -F '\t' '
          $1 ~ /^[?] *$/ && $3 == "[no test files]" { next }
          NF >= 3 && $1 ~ /^(ok|FAIL) *$/ && $2 != "" {
            packages[NR] = $2
            if (length($2) > width) width = length($2)
            sub(/ +$/, "", $1)
            results[NR] = $1 "  " $3
            next
          }
          { diagnostics[NR] = $0 }
          END {
            if (width > 0) printf "%-*s  %s\n", width, "PACKAGE", "TEST RESULT"
            for (line = 1; line <= NR; line++) {
              if (line in packages) {
                printf "%-*s  %s\n", width, packages[line], results[line]
              } else if (line in diagnostics) {
                print diagnostics[line]
              }
            }
          }
        '
  vet:
    cmds: [make vet]
  coverage:
    dir: '{{.USER_WORKING_DIR}}'
    silent: true
    cmds:
      - bash "{{.ROOT_DIR}}/infra/scripts/coverage.sh" .
  mocks:
    dir: '{{.USER_WORKING_DIR}}'
    silent: true
    cmds:
      - |
        set -e
        if ! command -v mockgen >/dev/null 2>&1; then
          bin=$(go env GOBIN)
          if [ -z "$bin" ]; then
            gopath=$(go env GOPATH)
            bin="${gopath%%:*}/bin"
          fi
          export PATH="$bin:$PATH"
        fi
        if ! command -v mockgen >/dev/null 2>&1; then
          printf '%s\n' 'Install mockgen: go install go.uber.org/mock/mockgen@v0.6.0' >&2
          exit 1
        fi
        GOWORK=off go generate ./...
