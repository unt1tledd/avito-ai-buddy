version: '3'
tasks:
  deps:
    cmds: [make deps]
  verify:
    cmds: [make verify]
  fmt:
    cmds: [make fmt]
  lint:
    cmds: [make lint]
  test:
    silent: true
    cmds:
      - |
        set -o pipefail
        make test | awk -F '\t' '
          $1 ~ /^[?] *$/ && $3 == "[no test files]" { next }
          NF >= 3 && $1 ~ /^(ok|FAIL) *$/ && $2 != "" {
            packages[NR] = $2
            if (length($2) > width) width = length($2)
            sub(/ +$/, "", $1)
            results[NR] = $1 "  " $3
            next
          }
          { diagnostics[NR] = $0 }
          END {
            if (width > 0) printf "%-*s  %s\n", width, "PACKAGE", "TEST RESULT"
            for (line = 1; line <= NR; line++) {
              if (line in packages) {
                printf "%-*s  %s\n", width, packages[line], results[line]
              } else if (line in diagnostics) {
                print diagnostics[line]
              }
            }
          }
        '
  vet:
    cmds: [make vet]
  coverage:
    dir: '{{.USER_WORKING_DIR}}'
    silent: true
    cmds:
      - |
        set -e
        set -o pipefail
        packages=$(go list ./...)
        packages=$(printf '%s\n' "$packages" | awk '
          $0 !~ /\/(mock|mocks|sqlc|entity|errors|port|adapter|adapters|config|migrations)(\/|$)/ &&
          $0 !~ /\/(cmd\/app|internal\/(app|controller|controller\/converter))$/
        ')
        if [ -n "$packages" ]; then
          width=$(printf '%s\n' "$packages" | awk 'length > width { width = length } END { print width }')
          profile=$(mktemp "${TMPDIR:-/tmp}/go-coverage.XXXXXX")
          trap 'rm -f "$profile"' EXIT
          go test -coverprofile="$profile" $packages | awk -v width="$width" '
            BEGIN {
              if (width < length("PACKAGE")) width = length("PACKAGE")
              printf "%-*s  %8s\n", width, "PACKAGE", "COVERAGE"
            }
            NF >= 5 && $(NF - 3) == "coverage:" {
              package = $1 == "ok" ? $2 : $1
              printf "%-*s  %8s\n", width, package, $(NF - 2)
              next
            }
            $1 == "?" && /\[no test files\]$/ {
              printf "%-*s  %8s\n", width, $2, "-"
              next
            }
            { print }
          '
          go tool cover -func="$profile" | awk -v width="$width" '
            $1 == "total:" { printf "%-*s  %8s\n", width, "TOTAL", $NF }
          '
        fi
  mocks:
    dir: '{{.USER_WORKING_DIR}}'
    silent: true
    cmds:
      - |
        set -e
        if ! command -v mockgen >/dev/null 2>&1; then
          bin=$(go env GOBIN)
          if [ -z "$bin" ]; then
            gopath=$(go env GOPATH)
            bin="${gopath%%:*}/bin"
          fi
          export PATH="$bin:$PATH"
        fi
        if ! command -v mockgen >/dev/null 2>&1; then
          printf '%s\n' 'Install mockgen: go install go.uber.org/mock/mockgen@v0.6.0' >&2
          exit 1
        fi
        GOWORK=off go generate ./...
