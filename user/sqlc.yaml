version: "2"
sql:
  - engine: postgresql
    queries: internal/repository/user/queries.sql
    schema: migrations/migrations
    gen:
      go:
        package: user
        out: internal/repository/user/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        omit_unused_structs: true
        emit_pointers_for_null_types: true
