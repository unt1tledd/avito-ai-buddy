version: "2"
sql:
  - engine: postgresql
    queries:
      - internal/repository/task/queries.sql
      - internal/repository/outbox/outbox.sql
    schema: migrations/migrations
    gen:
      go:
        package: sqlc
        out: internal/repository/task/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
