[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-ai-buddy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "mcp>=2,<3",
    "psycopg-pool>=3.2,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "pyyaml>=6,<7",
]

[tool.setuptools.package-data]
"ai_service.agents" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
