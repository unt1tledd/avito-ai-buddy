openapi: 3.1.0
info:
  title: AI-buddy internal API
  version: 1.0.0
paths:
  /healthz:
    get:
      summary: Health
      operationId: health_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Healthz Get
  /readyz:
    get:
      summary: Readiness
      operationId: readiness_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Required configuration or index unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/v1/get_answer:
    post:
      summary: Get Answer
      description: Get an answer using the current user profile supplied by authenticated
        Chat. AI does not call User. Maximum request body is 256 KiB.
      operationId: get_answer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Malformed request body
        '401':
          description: Invalid or missing chat service token
        '408':
          description: Request body deadline expired
        '413':
          description: Request body exceeds 256 KiB
        '502':
          description: Embeddings, knowledge base, model or tool orchestration error
        '503':
          description: AI service configuration is incomplete
        '504':
          description: Chat deadline expired
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    ChatActor:
      properties:
        user_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          title: User Id
        team:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          title: Team
        role:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          title: Role
        actual_end_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Actual End Date
      additionalProperties: false
      type: object
      required:
      - user_id
      - team
      - role
      title: ChatActor
      description: Current user context supplied by the authenticated Chat service.
    ChatRequest:
      properties:
        conversation_id:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          - type: 'null'
          title: Conversation Id
          description: Optional chat ID for correlation. AI does not store conversations.
        actor:
          $ref: '#/components/schemas/ChatActor'
          description: Current user ID, role and team verified by Chat. AI uses this
            profile for document ACL and does not call User. Forward actual_end_date
            when the internship has ended.
        message:
          type: string
          maxLength: 4000
          minLength: 1
          title: Message
        history:
          items:
            $ref: '#/components/schemas/Message'
          type: array
          maxItems: 12
          title: History
          description: Accepted for compatibility. Each answer uses the current message
            and current search results.
      additionalProperties: false
      type: object
      required:
      - actor
      - message
      title: ChatRequest
    ChatResponse:
      properties:
        answer:
          type: string
          title: Answer
        sources:
          items:
            $ref: '#/components/schemas/SearchHit'
          type: array
          maxItems: 6
          title: Sources
      additionalProperties: false
      type: object
      required:
      - answer
      - sources
      title: ChatResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Message:
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          title: Role
        content:
          type: string
          maxLength: 4000
          minLength: 1
          title: Content
      additionalProperties: false
      type: object
      required:
      - role
      - content
      title: Message
    Readiness:
      properties:
        status:
          type: string
          enum:
          - ready
          - unavailable
          title: Status
        capability:
          type: string
          const: questions
          title: Capability
          default: questions
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      required:
      - status
      title: Readiness
    SearchHit:
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          title: Id
        title:
          type: string
          maxLength: 160
          minLength: 1
          title: Title
        url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Url
        text:
          type: string
          maxLength: 1200
          minLength: 1
          title: Text
      additionalProperties: false
      type: object
      required:
      - id
      - title
      - text
      title: SearchHit
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
