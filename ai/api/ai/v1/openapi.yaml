---
openapi: 3.1.0
info:
  title: AI-buddy internal API
  version: 1.0.0
paths:
  /healthz:
    get:
      summary: Health
      operationId: health_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Healthz Get
  /readyz:
    get:
      summary: Readiness
      operationId: readiness_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Required configuration or index unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/v1/chat:
    post:
      summary: Chat
      description: Internal chat endpoint. Maximum request body is 256 KiB.
      operationId: chat_api_v1_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Malformed request body
        '401':
          description: Invalid or missing chat service token
        '408':
          description: Request body deadline expired
        '413':
          description: Request body exceeds 256 KiB
        '502':
          description: User, onboarding, embeddings, knowledge base, model or tool
            orchestration error
        '503':
          description: AI service configuration is incomplete or the requested capability
            is disabled
        '504':
          description: Chat deadline expired
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    ActionResult:
      properties:
        step_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          title: Step Id
        status:
          type: string
          const: completed
          title: Status
      additionalProperties: false
      type: object
      required:
      - step_id
      - status
      title: ActionResult
    Actor:
      properties:
        user_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          title: User Id
        team:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          title: Team
        role:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          title: Role
      additionalProperties: false
      type: object
      required:
      - user_id
      - team
      - role
      title: Actor
    ActorRef:
      properties:
        user_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          title: User Id
      additionalProperties: false
      type: object
      required:
      - user_id
      title: ActorRef
    ChatRequest:
      properties:
        conversation_id:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          - type: 'null'
          title: Conversation Id
          description: Stable chat ID. Required in integration mode.
        actor:
          anyOf:
          - $ref: '#/components/schemas/Actor'
          - $ref: '#/components/schemas/ActorRef'
          title: Actor
          description: Integration requires a canonical positive int64 user ID as
            a decimal string. Role and team in the request are used only in demo mode.
        message:
          type: string
          maxLength: 4000
          minLength: 1
          title: Message
        history:
          items:
            $ref: '#/components/schemas/Message'
          type: array
          maxItems: 12
          title: History
          description: Accepted for compatibility. Each answer uses the current message
            and current search results.
        confirmed_step_id:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          - type: 'null'
          title: Confirmed Step Id
      additionalProperties: false
      type: object
      required:
      - actor
      - message
      title: ChatRequest
    ChatResponse:
      properties:
        answer:
          type: string
          title: Answer
        sources:
          items:
            $ref: '#/components/schemas/SearchHit'
          type: array
          maxItems: 6
          title: Sources
        action:
          anyOf:
          - $ref: '#/components/schemas/ActionResult'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - answer
      - sources
      title: ChatResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Message:
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          title: Role
        content:
          type: string
          maxLength: 4000
          minLength: 1
          title: Content
      additionalProperties: false
      type: object
      required:
      - role
      - content
      title: Message
    Readiness:
      properties:
        status:
          type: string
          enum:
          - ready
          - unavailable
          title: Status
        capability:
          type: string
          enum:
          - chat
          - questions
          - confirmations
          title: Capability
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      required:
      - status
      - capability
      title: Readiness
    SearchHit:
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          title: Id
        title:
          type: string
          maxLength: 160
          minLength: 1
          title: Title
        url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Url
        text:
          type: string
          maxLength: 1200
          minLength: 1
          title: Text
      additionalProperties: false
      type: object
      required:
      - id
      - title
      - text
      title: SearchHit
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
