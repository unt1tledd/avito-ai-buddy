---
openapi: 3.1.0
info:
  title: AI-buddy internal API
  version: 1.0.0
paths:
  "/healthz":
    get:
      summary: Health
      operationId: health_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Healthz Get
  "/v1/chat":
    post:
      summary: Chat
      operationId: chat_v1_chat_post
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ChatRequest"
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ChatResponse"
        '401':
          description: Invalid or missing chat service token
        '502':
          description: Model or tool orchestration error
        '503':
          description: AI service configuration is incomplete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
      security:
      - HTTPBearer: []
components:
  schemas:
    ActionResult:
      properties:
        step_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
          title: Step Id
        status:
          type: string
          const: completed
          title: Status
      additionalProperties: false
      type: object
      required:
      - step_id
      - status
      title: ActionResult
    Actor:
      properties:
        user_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
          title: User Id
        team:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
          title: Team
        role:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
          title: Role
      additionalProperties: false
      type: object
      required:
      - user_id
      - team
      - role
      title: Actor
    ChatRequest:
      properties:
        actor:
          "$ref": "#/components/schemas/Actor"
        message:
          type: string
          maxLength: 4000
          minLength: 1
          title: Message
        history:
          items:
            "$ref": "#/components/schemas/Message"
          type: array
          maxItems: 12
          title: History
        confirmed_step_id:
          anyOf:
          - type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
          - type: 'null'
          title: Confirmed Step Id
      additionalProperties: false
      type: object
      required:
      - actor
      - message
      title: ChatRequest
    ChatResponse:
      properties:
        answer:
          type: string
          title: Answer
        sources:
          items:
            "$ref": "#/components/schemas/SearchHit"
          type: array
          title: Sources
        action:
          anyOf:
          - "$ref": "#/components/schemas/ActionResult"
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - answer
      - sources
      title: ChatResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            "$ref": "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Message:
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          title: Role
        content:
          type: string
          maxLength: 4000
          minLength: 1
          title: Content
      additionalProperties: false
      type: object
      required:
      - role
      - content
      title: Message
    SearchHit:
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
          title: Id
        title:
          type: string
          title: Title
        url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Url
        text:
          type: string
          title: Text
      additionalProperties: false
      type: object
      required:
      - id
      - title
      - text
      title: SearchHit
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
