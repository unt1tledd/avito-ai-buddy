syntax = "proto3";

package onboarding.v1;

import "google/api/annotations.proto";
import "validate/validate.proto";

option go_package = "avito-ai-buddy/pkg/generated/step/v1;stepv1";

service StepService {
  rpc GetCurrentStep(GetCurrentStepRequest) returns (GetCurrentStepResponse) {
    option (google.api.http) = { get: "/v1/step/{user_id}/current" };
  }
  rpc CompleteStep(CompleteStepRequest) returns (CompleteStepResponse) {
    option (google.api.http) = { put: "/v1/step/{user_id}/{step_id}/completion" };
  }
  rpc ReopenStep(ReopenStepRequest) returns (ReopenStepResponse) {
    option (google.api.http) = {
      patch: "/v1/step/{user_id}/{step_id}/completion"
      body: "*"
    };
  }
  rpc UpdateStepTemplate(UpdateStepTemplateRequest) returns (UpdateStepTemplateResponse) {
    option (google.api.http) = {
      put: "/v1/step/{step_key}"
      body: "*"
    };
  }
}

message UpdateStepTemplateRequest {
  string step_key = 1 [(validate.rules).string.min_len = 1];
  string title = 2 [(validate.rules).string.pattern = "[^\\p{Z}\\t-\\r\\x{0085}]"];
  string description = 3;
  string period = 4 [(validate.rules).string.pattern = "[^\\p{Z}\\t-\\r\\x{0085}]"];
  int32 position = 5 [(validate.rules).int32.gt = 0];
  string resource_id = 6;
}

message UpdateStepTemplateResponse {}

message GetCurrentStepRequest {
  int64 user_id = 1 [(validate.rules).int64.gt = 0];
}

message GetCurrentStepResponse {
  Step step = 1;
}

message CompleteStepRequest {
  int64 user_id = 1 [(validate.rules).int64.gt = 0];
  string step_id = 2 [(validate.rules).string.pattern = "[^\\p{Z}\\t-\\r\\x{0085}]"];
}

message CompleteStepResponse {
  string step_id = 1;
  string status = 2;
}

message ReopenStepRequest {
  int64 user_id = 1 [(validate.rules).int64.gt = 0];
  string step_id = 2 [(validate.rules).string.pattern = "[^\\p{Z}\\t-\\r\\x{0085}]"];
  string status = 3 [(validate.rules).string.const = "pending"];
}

message ReopenStepResponse {
  string step_id = 1;
  string status = 2;
}

message Step {
  string id = 1;
  string title = 2;
  string description = 3;
  string period = 4;
  string resource_id = 5;
  string status = 6;
}
