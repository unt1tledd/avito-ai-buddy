services:
  load-provider:
    image: python:3.12-slim
    command: ["python", "/load/mock-provider.py"]
    volumes:
      - ./tests/load/mock-provider.py:/load/mock-provider.py:ro

  load-db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: load_test
      POSTGRES_PASSWORD: load_test_local
      POSTGRES_DB: load_knowledge
    volumes:
      - load_knowledge:/var/lib/postgresql/data
      - ./tests/load/mock-db.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "load_test", "-d", "load_knowledge"]
      interval: 2s
      timeout: 3s
      retries: 20

  ai:
    environment:
      KNOWLEDGE_DB_DSN: postgresql://load_test:load_test_local@load-db:5432/load_knowledge?sslmode=disable
      LLM_BASE_URL: http://load-provider:8080/v1
      LLM_API_KEY: load-test
      LLM_MODEL: load-stub
      EMBEDDING_BASE_URL: http://load-provider:8080/v1
      EMBEDDING_API_KEY: load-test
      EMBEDDING_MODEL: load-stub
      EMBEDDING_PROVIDER: ""
      EMBEDDING_DIMENSIONS: "1536"
      EMBEDDING_INDEX_VERSION: "1"
      KNOWLEDGE_PROCESSING_APPROVED: "true"
      CHAT_TIMEOUT_SECONDS: "25"
    volumes:
      - ./tests/load/mock-documents.json:/load-documents.json:ro

  ai-migrate:
    environment:
      GOOSE_DBSTRING: postgresql://load_test:load_test_local@load-db:5432/load_knowledge?sslmode=disable

volumes:
  load_knowledge:
