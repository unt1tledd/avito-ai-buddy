syntax = "proto3";

package chat.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "avito-ai-buddy/pkg/generated/chat/v1;chatv1";

service ChatService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {
    option (google.api.http) = {
      post: "/v1/chat/messages"
      body: "*"
    };
  }
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/chat/messages"
    };
  }
}

service ConversationService {
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse) {
    option (google.api.http) = { get: "/v1/chat/conversations" };
  }
  rpc CreateConversation(CreateConversationRequest) returns (Conversation) {
    option (google.api.http) = { post: "/v1/chat/conversations" };
  }
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse) {
    option (google.api.http) = { delete: "/v1/chat/conversations/{id}" };
  }
  rpc DeleteAllConversations(DeleteAllConversationsRequest) returns (DeleteAllConversationsResponse) {
    option (google.api.http) = { delete: "/v1/chat/conversations" };
  }
}

message Conversation {
  int64 id = 1 [(validate.rules).int64.gt = 0];
  string title = 2 [(validate.rules).string.min_len = 1];
  google.protobuf.Timestamp created_at = 3 [(validate.rules).timestamp.required = true];
}

message ListConversationsRequest {}
message ListConversationsResponse {
  repeated Conversation conversations = 1 [(validate.rules).repeated.items.message.required = true];
}
message CreateConversationRequest {}
message DeleteConversationRequest { int64 id = 1 [(validate.rules).int64.gt = 0]; }
message DeleteConversationResponse {}
message DeleteAllConversationsRequest {}
message DeleteAllConversationsResponse {}

service ActionService {
  rpc ConfirmProposal(ConfirmProposalRequest) returns (ConfirmProposalResponse) {
    option (google.api.http) = {
      post: "/v1/chat/proposals/{proposal_id}/confirm"
    };
  }
}

message SendMessageRequest {
  string text = 1 [(validate.rules).string.pattern = "[^\\p{Z}\\t-\\r\\x{0085}]"];
  // Generate a positive key for each new message and reuse it on retries.
  int64 idempotency_key = 2 [(validate.rules).int64.gt = 0];
}

message SendMessageResponse {
  reserved 1;
  reserved "user_message";

  Message assistant_message = 2;
}

message GetHistoryRequest {
  int32 page_size = 1 [(validate.rules).int32.gte = 0];
  string page_token = 2;
}

message GetHistoryResponse {
  repeated Message messages = 1;
  string next_page_token = 2;
}

message ConfirmProposalRequest {
  string proposal_id = 1 [(validate.rules).string.pattern = "[^\\p{Z}\\t-\\r\\x{0085}]"];
}

message ConfirmProposalResponse {
  AccessRequest access_request = 1;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_ASSISTANT = 2;
}

message Message {
  string id = 1;
  MessageRole role = 2;
  string text = 3;
  google.protobuf.Timestamp created_at = 4;
  repeated Source sources = 5;
  AccessProposal proposal = 6;
}

message Source {
  string document_id = 1;
  string title = 2;
  string url = 3;
}

message AccessProposal {
  string id = 1;
  string resource_id = 2;
  string resource_label = 3;
  string access_level = 4;
  AccessRequest access_request = 5;
}

message AccessRequest {
  string task_id = 1;
  string external_request_id = 2;
  string status = 3;
}
