version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/conversation/queries.sql"
    schema: "migrations/migrations"
    gen:
      go:
        package: "conversation"
        sql_package: "pgx/v5"
        out: "internal/repository/conversation/sqlc"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true
  - engine: "postgresql"
    queries: "internal/repository/message/queries.sql"
    schema: "migrations/migrations"
    gen:
      go:
        package: "message"
        sql_package: "pgx/v5"
        out: "internal/repository/message/sqlc"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true
  - engine: "postgresql"
    queries: "internal/repository/action/queries.sql"
    schema: "migrations/migrations"
    gen:
      go:
        package: "action"
        sql_package: "pgx/v5"
        out: "internal/repository/action/sqlc"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true
  - engine: "postgresql"
    queries: "internal/repository/outbox/queries.sql"
    schema: "migrations/migrations"
    gen:
      go:
        package: "outbox"
        sql_package: "pgx/v5"
        out: "internal/repository/outbox/sqlc"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true
